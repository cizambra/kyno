name: Prelaunch acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/prelaunch-acceptance.yml
      - pyproject.toml
      - src/kyno/__init__.py
      - tests/checks/test_smoke.py

permissions:
  contents: read

jobs:
  databases:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kyno
          POSTGRES_PASSWORD: acceptance
          POSTGRES_DB: kyno_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kyno -d kyno_acceptance"
          --health-interval 10s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: acceptance
          MYSQL_DATABASE: kyno_acceptance
          MYSQL_USER: kyno
          MYSQL_PASSWORD: acceptance
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      KYNO_TEST_POSTGRES_URL: postgresql+psycopg://kyno:acceptance@127.0.0.1:5432/kyno_acceptance
      KYNO_TEST_MYSQL_URL: mysql+pymysql://kyno:acceptance@127.0.0.1:3306/kyno_acceptance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,mysql,langgraph]"
      - name: Require both database connections
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          for variable in ("KYNO_TEST_POSTGRES_URL", "KYNO_TEST_MYSQL_URL"):
              engine = create_engine(os.environ[variable])
              with engine.connect() as connection:
                  print(engine.dialect.name, connection.execute(text("SELECT VERSION()")).scalar())
              engine.dispose()
          PY
      - name: Run suite with both database backends enabled
        run: python -m pytest -q --junitxml=database-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-results
          path: database-results.xml

  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Accept the built wheel outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          wheels=("$GITHUB_WORKSPACE"/dist/*.whl)
          test "${#wheels[@]}" -eq 1
          acceptance="$RUNNER_TEMP/kyno-wheel-acceptance"
          python -m venv "$acceptance/venv"
          "$acceptance/venv/bin/python" -m pip install "${wheels[0]}[dev,crewai,langgraph]"
          mkdir "$acceptance/run"
          cp -R tests "$acceptance/run/tests"
          cp pyproject.toml "$acceptance/run/"
          cd "$acceptance/run"
          unset PYTHONPATH
          "$acceptance/venv/bin/python" -c 'import sys, kyno, kyno.sdk, crewai.hooks, langgraph.graph; from pathlib import Path; assert Path(kyno.__file__).resolve().is_relative_to(Path(sys.prefix).resolve()), kyno.__file__; print(kyno.__file__)'
          "$acceptance/venv/bin/kyno" --help
          "$acceptance/venv/bin/python" -m pytest -q \
            tests/core/e2e/test_deployment_e2e.py \
            tests/surface/e2e/test_adapter_server_roundtrip.py \
            --junitxml="$GITHUB_WORKSPACE/wheel-results.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wheel-acceptance
          path: |
            dist/
            wheel-results.xml
