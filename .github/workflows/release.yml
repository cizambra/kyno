name: Release to PyPI on tag

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The tag names the release; pyproject names the build. Refuse to
      # publish one under the other's name.
      - run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag is $GITHUB_REF_NAME but pyproject says $version"; exit 1; }
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q --cov=kyno --cov-fail-under=90 --cov-report=term-missing:skip-covered
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
