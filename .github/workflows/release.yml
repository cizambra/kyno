name: Release to PyPI on tag

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The tag names the release; pyproject names the build. Refuse to
      # publish one under the other's name.
      - run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag is $GITHUB_REF_NAME but pyproject says $version"; exit 1; }
      - run: python -m pip install -e ".[dev,crewai,langgraph]"
      - run: python -c "import crewai.hooks; import langgraph.graph"
      - run: python -m pytest -q --cov=kyno --cov-fail-under=90 --cov-report=term-missing:skip-covered
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pip install build
      - run: python -m build
      - name: Accept the built wheel outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          wheels=("$GITHUB_WORKSPACE"/dist/*.whl)
          test "${#wheels[@]}" -eq 1
          acceptance="$RUNNER_TEMP/kyno-wheel-acceptance"
          python -m venv "$acceptance/venv"
          "$acceptance/venv/bin/python" -m pip install "${wheels[0]}[dev,crewai,langgraph]"
          mkdir "$acceptance/run"
          cp -R tests "$acceptance/run/tests"
          cp pyproject.toml "$acceptance/run/"
          cd "$acceptance/run"
          unset PYTHONPATH
          "$acceptance/venv/bin/python" -c 'import sys, kyno, kyno.sdk, crewai.hooks, langgraph.graph; from pathlib import Path; assert Path(kyno.__file__).resolve().is_relative_to(Path(sys.prefix).resolve()), kyno.__file__; print(kyno.__file__)'
          "$acceptance/venv/bin/kyno" --help
          "$acceptance/venv/bin/python" -m pytest -q \
            tests/core/e2e/test_deployment_e2e.py \
            tests/surface/e2e/test_adapter_server_roundtrip.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
