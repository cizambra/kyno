name: Release to PyPI on tag

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The tag names the release; pyproject names the build. Refuse to
      # publish one under the other's name.
      - run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag is $GITHUB_REF_NAME but pyproject says $version"; exit 1; }
      - run: python -m pip install -e ".[dev,crewai,langgraph]"
      - run: python -c "import crewai.hooks; import langgraph.graph"
      - run: python -m pytest -q --cov=kyno --cov-fail-under=90 --cov-report=term-missing:skip-covered
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pip install build
      - run: python -m build
      - name: Accept the built wheel outside the checkout
        shell: bash
        run: |
          set -euo pipefail
          wheels=("$GITHUB_WORKSPACE"/dist/*.whl)
          test "${#wheels[@]}" -eq 1
          acceptance="$RUNNER_TEMP/kyno-wheel-acceptance"
          python -m venv "$acceptance/venv"
          "$acceptance/venv/bin/python" -m pip install "${wheels[0]}[dev,crewai,langgraph]"
          mkdir "$acceptance/run"
          cp -R tests "$acceptance/run/tests"
          cp pyproject.toml "$acceptance/run/"
          cd "$acceptance/run"
          unset PYTHONPATH
          "$acceptance/venv/bin/python" -c 'import sys, kyno, kyno.sdk, crewai.hooks, langgraph.graph; from pathlib import Path; assert Path(kyno.__file__).resolve().is_relative_to(Path(sys.prefix).resolve()), kyno.__file__; print(kyno.__file__)'
          "$acceptance/venv/bin/kyno" --help
          "$acceptance/venv/bin/python" -m pytest -q \
            tests/core/e2e/test_deployment_e2e.py \
            tests/surface/e2e/test_adapter_server_roundtrip.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-mcp:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Match the listing to the released package
        run: |
          python - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          path = Path("server.json")
          manifest = json.loads(path.read_text())
          manifest["version"] = version
          for package in manifest["packages"]:
              package["version"] = version
          path.write_text(json.dumps(manifest, indent=2) + "\n")
          PY
      - name: Install MCP publisher
        run: |
          curl --fail --location --retry 3 \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz \
            --output mcp-publisher.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum --check
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: Validate the listing
        run: ./mcp-publisher validate server.json
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish the listing
        run: ./mcp-publisher publish
