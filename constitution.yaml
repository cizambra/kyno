mission: To help organizations keep multi-agent systems coherent.

principles:
  - title: Coherence is the goal
    description: >-
      When we make changes or add new features, we do them because they help support the mission, not personal
      interests. If a change serves a narrow edge case for a particular individual or organization,
      then it's not a coherent one.
  - title: Stay simple, stay nimble
    description: >-
      We refuse to build complexity just for the sake of it, or features because they just look cool.
      Every feature must be justified by a material benefit to the common good.
      We focus on what matters, because it helps us bring coherence faster.
  - title: We don't judge
    description: >-
      Our focus is on our mission. Not what consumers do with it. We won't judge consumers' constitutions; our role is to help
      support direction, not to define, score or edit what is valuable for our consumers.
  - title: We favor two-way door decisions, we mitigate one-way door ones effectively
    description: >-
      When we decide, we put all the cards over the table and establish
      our tradeoffs transparently. We favor those decisions that are reversible. Sometimes that's not an option, and we
      must choose between decisions that are not reversible. We choose the one we have the most control over
      during mitigation. We understand we will not always make the right decision, but we know ahead of time what to do
      in the case that happens.
  - title: What worked before, works now
    description: >-
      When we build, we build thinking about the future. When we fail to cover future cases and we address them,
      we make sure nothing that used to work breaks.
  - title: We are frugal
    description: >-
      Changes in Kyno are consumed by other systems. Mostly agentic AI systems. These systems might
      call Kyno for their purposes, so every piece of output we serve must have a purpose, otherwise it is
      dead weight that has financial impact on our consumers.
  - title: One PR, one meaningful unit of value
    description: >-
      Every PR must have one single responsibility; if it does two things, it's already doing too much.
  - title: We don't make promises
    description: >-
      While it is tempting to make guarantees about the product, we are serving stochastic systems where probabilities
      rule. Nothing is guaranteed. We can mention possibilities and likelihood, but guarantees can backfire.
      The only guarantee is that whatever change we make will be principled in our constitution.
  - title: We don't assume understanding
    description: >-
      Nobody, not even AI, can hold the context of everything. So when we comment, discuss, review,
      we want to provide the relevant context in full, with no assumptions. Name who you mean (e.g. the consumers)
      rather than leave references around (e.g. they).
  - title: We own it
    description: >-
      When breaking changes happen, we communicate externally and internally with speed and transparency. We don't point
      fingers. We focus on mitigating and supporting our consumers, and learn from what happened so it doesn't happen again.
      In the same way, we own the risks of our decisions.
declaration: |
  ## What is Kyno

  Kyno is what I call _Coherence-as-Infrastructure_.

  When a multi-agent system's goals change, agents holding a stale copy of
  the old direction keep producing work for it — and quality checks against
  the stale copy push the work back toward the obsolete goal. Direction
  needs to live in one place, versioned, where every agent can consult it
  before every step. Kyno is that place, kept deliberately small.

  ## Why this project exists

  Multi-agent architecture is quickly becoming a trend. With the same speed, this
  trend is uncovering another phenomenon that is silently permeating the direction that products, and
  in consequence businesses and organizations, are taking: _agentic drifting_. By agentic drifting,
  we understand it as "the gradual, hidden process where an AI agent slowly loses alignment with
  its intended goals, policies, or workflows over time"[1](https://medium.com/@ravikumar.singi_16677/agentic-drift-keeping-ai-aligned-reliable-and-roi-driven-a099fa554d08).

  But drift goes _beyond_ that. Let me explain.

  I've been talking about drift for a while. Drift is not a phenomenon that only occurs in AI agents.
  It's a phenomenon that also happens at a human level. Drift is a behavioral force that applies a pull on humans
  and makes them act out of coherence. Furthermore, drift is a property shared by _all_ systems that operate
  under a _directional regime_ over time. Agents and humans are a manifestation of this same dynamic.

  I think we have all observed this drift in different systems, but we are just now able to name it
  more clearly.

  As a consequence of my research on coherence, I developed one thesis — or more like a hot take: **drift is the default**.
  A behavioral cousin of entropy. If you leave a room untouched, it tends to get cluttered over time.
  Same happens with the behavior of the systems I just described. Bringing coherence, just like cleaning a room,
  demands energy and alignment.

  So...drift is the default, _cool_. What does it mean for agents?

  It means that agents will keep drifting if there is no active drift-management process that helps bring coherence
  to the system. The hard truth is that drift is not a property that can be eliminated; because it's the
  default, it can only be managed.

  On top of all that, drift is also fractal. It happens at different scales. Humans drift, and when you
  assemble teams, the team itself experiences combined drift, along with the structure's own drift. So
  drift compounds, individually and fractally. Furthermore, drift spreads, in an effect I call _resonance_.
  Like the rotten apple principle. One apple rots, and the rot starts spreading to all the apples around.
  And because drift is the default, it doesn't take effort for that to happen. Like a bad telephone game.

  At this point you are probably familiar with it: you have a swarm of agents doing work, and it takes one
  agent drifting on its result to have the rest of the system drift upon the handoff of that result.

  The literature has started to describe this problem already [2](https://arxiv.org/pdf/2601.04170).
  And because drift is the default, I think we need to invest in coherence and alignment.

  Businesses and organizations today practice what I call _top-bottom governance_: systems that draw the boundaries
  of what agents within a system can do, and enforce them through rules and policies.
  While this works not only for agents but also for human individuals and human groups, you also want them
  to have the ability to exercise self-governance and make the right judgment calls when making decisions
  and taking actions on behalf of themselves and of the systems they are inserted into. This is what I call
  _bottom-up_ agency.

  Kyno is the product of applying my synthesis work, [_Coherence Dynamics Theory_](https://www.adaptable-discipline.com/cdt),
  into solving the problem of drift management, introducing a bottom-up layer of coherence into agentic
  orchestration.

  ## How we hold ourselves to our principles

  This constitution is set through the same CLI any operator uses, published
  through the same publishing flow, and rendered on the same page. When our
  direction changes, the change note is public. If the project's behavior
  contradicts a principle here, that is a bug in the project.

note: Top-bottom governance, bottom-up agency, and where Kyno stands.
