manifest_version = 1
status = "classification"
reviewed_on = "2026-09-07"

[classification]
question = "What would have to break for this test to fail?"
mixed_file_rule = "Split a file before moving it when tests in the file have different destinations."
destination_rule = "Use checks for repository or distribution invariants; otherwise choose the runtime namespace and failure-boundary lane."

[markers.integration]
name = "integration"
default_selection = "deselected by pyproject.toml addopts"
meaning = "Requires a real orchestrator or a live Kyno."
decision = "Keep this marker name during the layout move."

[markers.e2e]
name = "e2e"
default_selection = "selected by default"
meaning = "Drives a real client session against the built server, in memory or over localhost."

